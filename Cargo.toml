[package]
name = "rustydoku"
version = "0.1.0"
edition = "2021"
authors = ["Skalse <lavrishkovlad@gmail.com>"]
repository = "https://github.com/brizzinck/rustydoku.git"
license = "MIT"
keywords = ["game", "bevy", "gamedev"]
categories = ["game-development"]
readme = "README.md"

[dependencies]
bevy = { version = "0.15.3", features = ["mp3"] }
rand = "0.8.5"
getrandom = { version = "0.2", features = ["js"] }
once_cell = "1.21.1"
bevy_kira_audio = { version = "0.22.0" }

[dependencies.bevy-inspector-egui]
version = "0.29.1"
optional = true  

[features]
default = ["dynamic"]
dynamic = ["bevy/dynamic_linking"]
debug-inspector = ["bevy-inspector-egui"]  

[profile.release]
opt-level = 3  
lto = "thin"   
codegen-units = 1
panic = "unwind"
strip = true

