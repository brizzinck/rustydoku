[package]
name = "rustydoku"
version = "0.1.0"
edition = "2021"
authors = ["Skalse <lavrishkovlad@gmail.com>"]
repository = "https://github.com/brizzinck/rustydoku.git"
license = "MIT"
keywords = ["game", "bevy", "gamedev"]
categories = ["game-development"]
readme = "README.md"

[dependencies]
bevy = "0.15.3"
rand = "0.8.5"
getrandom = "0.2"
once_cell = "1.21.1"
bevy_kira_audio = "0.22.0"

[features]
default = ["dynamic", "mp3"]
dynamic = ["bevy/dynamic_linking"]
debug-inspector = ["bevy-inspector-egui"]
mp3 = ["bevy/mp3"]
wasm = ["getrandom/js"]

[dependencies.bevy-inspector-egui]
version = "0.29.1"
optional = true  

[profile.release]
opt-level = 3  
lto = "thin"   
codegen-units = 1
panic = "unwind"
strip = true

