[package]
name = "rustydoku"
version = "0.1.11"
edition = "2021"
authors = ["Skalse <lavrishkovlad@gmail.com>"]
description = "A puzzle game built with Bevy, inspired by Woodoku. Strategically place blocks, clear the board, and earn points!"
repository = "https://github.com/brizzinck/rustydoku.git"
license = "MIT"
keywords = ["game", "bevy", "gamedev"]
categories = ["game-development"]
readme = "README.md"
include = [
    "assets/**",
    "src/**",
    "Cargo.toml",
    "README.md",
]

[lib]
crate-type = [    
    "staticlib", 
    "cdylib",
    "rlib"
]

[dependencies]
rand = "0.8.5"
once_cell = "1.21.1"
bevy_kira_audio = "0.22.0"
tracing-subscriber = "0.3.19"
bevy_embedded_assets = "0.12.0"

[dependencies.bevy-inspector-egui]
version = "0.29.1"
optional = true  

[dependencies.bevy]
version = "0.15.3"
default-features = false

[features]
default = ["bevy_default"]
bevy_default = [
    "bevy/bevy_asset",
    "bevy/bevy_audio",
    "bevy/bevy_color",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_sprite",
    "bevy/bevy_state",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_winit",
    "bevy/multi_threaded",
    "bevy/png",
    "bevy/mp3",
]
debug-inspector = ["bevy-inspector-egui", "bevy/bevy_gizmos"]

[target.'cfg(target_os = "linux")'.dependencies]
image = "0.25.5"
winit = "0.30.9"
bevy = { version = "0.15.3", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_os = "windows")'.dependencies]
image = "0.25.5"
winit = "0.30.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.15.3", default-features = false, features = ["webgl2"] }
wasm-bindgen = "0.2.100"

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.15.3", default-features = false, features = ["android-native-activity", "android_shared_stdcxx"] }

[profile.release]
opt-level = 3  
lto = "thin"   
codegen-units = 1
panic = "unwind"
strip = true

[package.metadata.android]
package = "org.skalse.rustydoku"
apk_name = "rustydoku"
strip = "strip"
assets = "assets"
resources = "android-deploy/app/src/main/res"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 33

[package.metadata.android.application]
label = "Rustydoku"
icon = "@mipmap/icon"
theme = "@style/RustydokuTheme"

[package.metadata.android.application.activity]
label = "Rustydoku"
orientation = "portrait"
exported = true
resizeable_activity = true
immersive = true

[package.metadata.android.signing.release]
path = "${RUSTYDOKU_KEYSTORE_PATH}"
key_alias = "${RUSTYDOKU_KEY_ALIAS}"
keystore_password = "${RUSTYDOKU_KEYSTORE_PASSWORD}"
