[package]
name = "rustydoku"
version = "0.1.11"
edition = "2021"
authors = ["Skalse <lavrishkovlad@gmail.com>"]
description = "A puzzle game built with Bevy, inspired by Woodoku. Strategically place blocks, clear the board, and earn points!"
repository = "https://github.com/brizzinck/rustydoku.git"
license = "MIT"
keywords = ["game", "bevy", "gamedev"]
categories = ["game-development"]
readme = "README.md"
include = [
    "assets/**",
    "src/**",
    "Cargo.toml",
    "README.md",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["bevy/mp3", "bevy/png"]
debug-inspector = ["bevy-inspector-egui"]

[dependencies]
bevy = "0.15.3"
rand = "0.8.5"
once_cell = "1.21.1"
bevy_kira_audio = "0.22.0"
tracing-subscriber = "0.3.19"
wasm-bindgen = "0.2.100"
bevy_embedded_assets = "0.12.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = "0.25.5"
winit = "0.30.9"

[dependencies.bevy-inspector-egui]
version = "0.29.1"
optional = true  

[profile.release]
opt-level = 3  
lto = "thin"   
codegen-units = 1
panic = "unwind"
strip = true
